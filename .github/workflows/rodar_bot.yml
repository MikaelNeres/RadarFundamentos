name: Radar IDIV CVM Daily

on:
  schedule:
    - cron: '0 22 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Copiando o código do repositório
        uses: actions/checkout@v4

      - name: Configurando o ambiente Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalando as bibliotecas
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Executando o Robô do Radar
        run: |
          cd RadarFundamentos || true
          python bot.py
